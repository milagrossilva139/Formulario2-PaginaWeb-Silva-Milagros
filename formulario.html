<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles_for.css">
    <title>Inscripción</title>
</head>
<body>
    <div>
        <h1>Formulario de Ingreso</h1>
        <p>Complete los siguientes campos</p>

        <form action="#" method="POST" id="registroForm">
            <fieldset>
                <legend>Datos Personales</legend>

                <div>
                    <label for="nombre">Nombre y Apellido</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Simona Rodriguez" required>
                </div>

                <div>
                    <label for="DNI">DNI</label>
                    <input type="number" id="DNI" name="DNI" placeholder="Ej: 35628673" required>
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 11 1234-5678">
                </div>

            </fieldset>

            <fieldset> 
                <legend>Cuenta y Seguridad</legend>
                <div>
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ej: Simona0312@gmail.com" required>
                </div>
                <div>
                    <label for="contraseña">Ingrese la contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Datos de Inscripción</legend>

                <div>
                    <label for="curso">Curso</label>
                    <select id="curso" name="curso" required>
                        <option value="">Seleccione un curso...</option>
                        <option value="desarrollo_web">Desarrollo web</option>
                        <option value="Ciencia_Datos">Ciencia de Datos</option>
                        <option value="Python">Programacion en Python</option>
                        <option value="Diseño">Diseño UX/UI</option>
                    </select>
                </div>

                <div>
                    <label>Turno preferido</label>
                    <div>
                        <label>
                            <input type="radio" name="turno" value="Mañana">
                            Mañana
                        </label>
                        <label>
                            <input type="radio" name="turno" value="Tarde">
                            Tarde
                        </label>
                        <label>
                            <input type="radio" name="turno" value="Noche">
                            Noche
                        </label>
                    </div>
                </div>

                <div>
                    <label>Conocimientos previos</label>
                    <div>
                        <label>
                            <input type="checkbox" name="conocimiento" value="HTML">
                            HTML
                        </label>
                        <label>
                            <input type="checkbox" name="conocimiento" value="CSS">
                            CSS
                        </label>
                        <label>
                            <input type="checkbox" name="conocimiento" value="JavaScript">
                            JavaScript
                        </label>
                        <label>
                            <input type="checkbox" name="conocimiento" value="Ninguno">
                            Ninguno
                        </label>
                </div>

                <div>
                    <label for="motivo">Desea realizar el curso porque:</label><br>
                    <textarea id="motivo" name="motivo" rows="5" placeholder="Escriba aquí..."></textarea>
                </div>
            </fieldset>

            <fieldset>
            <legend>Confirmación y Envío</legend>
                <div>
                    <label>
                        <input type="checkbox" name="terminos" required>
                            Acepto los <a href="#">términos y condiciones</a>
                    </label>
                </div>
            
                <div>
                    <button type="submit">Enviar la Inscripción</button>
                    <button type="reset">Limpiar formulario</button>
                </div>
            </fieldset>

            <footer>
                <p>Milagros Silva - 4B - 2026</p>
                <p><a href="index.html" class="volverlink">Volver al inicio</a></p>
            </footer>
        </form>
    </div>
</body>
</html>
